<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus exercicios de js</title>
</head>
<body>
    <p id="mensagem"> </p>
</body>
<script> 
    let n1 = +prompt('Digite um número: ')
    let n2 = +prompt("Digite outro número: ")
    let s = n1 + n2
    document.getElementById('mensagem').innerHTML = `A soma entre ${n1} e ${n2} é igual a ${s}`
    </script> 
</html>
