<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos DOM</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        #container {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            
        }

        #containerarea {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        div#area {
            font-size: 24px;
            background-color: orange;
            color: white;
            padding: 20px;
            width: 200px;
            height: 200px;
            line-height: 200px;
            text-align: center;
            border-radius: 10px;            
        }
        
        h1 {
            color: #333;
            text-align: center;
        }

        #paragrafo {
            font-size: 18px;
            color: #666;
            text-align: center;            
        }
        
    </style>
</head>
<body>
    <div id="container">
        <h1 id="titulo">Manipulando o DOM</h1>
        <p id="paragrafo">Este é um parágrafo de exemplo.</p>
    </div>

    <div id="containerarea">
        <div id="area"</div>
    </div>
    
</body>

<script>

 let area  = document.getElementById('area');

 area.addEventListener('mouseenter', entrar);
 area.addEventListener('mouseleave', sair);  

    function entrar() {
        area.style.backgroundColor = 'red';
        area.innerHTML = 'Entrou!';
    }

    function sair() {
        area.style.backgroundColor = 'orange';
        area.innerHTML = 'Saiu!';
    }
</script>
</html>
